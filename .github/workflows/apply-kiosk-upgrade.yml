name: Apply kiosk image tile upgrade

on:
  push:
    branches: [feature/kiosk-image-tiles]
    paths:
      - scripts/upgrade_kiosk.py
      - .github/workflows/apply-kiosk-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/kiosk-image-tiles
      - name: Apply UI upgrade
        run: python scripts/upgrade_kiosk.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git commit -m "Upgrade kiosk navigation with image tiles [skip ci]"
          git push origin feature/kiosk-image-tiles
